# ══════════════════════════════════════════════════════════════
# تشغيل روندي كامل على سيرفر المصنع بأمر واحد:
#   cp .env.example .env   (واملا القيم)
#   docker compose up -d --build
# ══════════════════════════════════════════════════════════════
name: rondi

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: rondi
      POSTGRES_USER: rondi_owner
      POSTGRES_PASSWORD: ${DB_OWNER_PASSWORD:?}
      APP_DB_PASSWORD: ${DB_APP_PASSWORD:?}
      TZ: Africa/Cairo
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres-init.sh:/docker-entrypoint-initdb.d/10-app-role.sh:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U rondi_owner -d rondi']
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [internal]
    # قاعدة البيانات مش مكشوفة على الشبكة خالص — بس الخادم يوصلها

  api:
    build: { context: .., dockerfile: deploy/api.Dockerfile }
    restart: unless-stopped
    depends_on:
      db: { condition: service_healthy }
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: postgresql://rondi_app:${DB_APP_PASSWORD}@db:5432/rondi
      DATABASE_MIGRATE_URL: postgresql://rondi_owner:${DB_OWNER_PASSWORD}@db:5432/rondi
      APP_ORIGIN: https://${SITE_ADDRESS:?}
      COOKIE_SECURE: 'true'
      TRUST_PROXY: 2
      DATA_ENCRYPTION_KEY: ${DATA_ENCRYPTION_KEY:?}
      SESSION_ABSOLUTE_HOURS: ${SESSION_ABSOLUTE_HOURS:-12}
      SESSION_IDLE_MINUTES: ${SESSION_IDLE_MINUTES:-120}
      LOGIN_MAX_ATTEMPTS: ${LOGIN_MAX_ATTEMPTS:-5}
      LOGIN_LOCK_MINUTES: ${LOGIN_LOCK_MINUTES:-15}
      RUN_SEED: ${RUN_SEED:-false}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:-}
      SEED_DEMO: ${SEED_DEMO:-false}
      SEED_DEMO_PASSWORD: ${SEED_DEMO_PASSWORD:-}
      TZ: Africa/Cairo
    networks: [internal]
    read_only: true
    tmpfs: [/tmp]
    security_opt: ['no-new-privileges:true']

  web:
    build:
      context: ..
      dockerfile: deploy/web.Dockerfile
      args: { API_URL: 'http://api:4000' }
    restart: unless-stopped
    depends_on: [api]
    environment:
      TZ: Africa/Cairo
    networks: [internal]
    read_only: true
    tmpfs: [/tmp, /app/apps/web/.next/cache]
    security_opt: ['no-new-privileges:true']

  # البوابة: اتصال مشفر (https) لكل الأجهزة في المصنع
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on: [web]
    ports: ['80:80', '443:443']
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:?}
      TLS_MODE: ${TLS_MODE:-internal}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
    networks: [internal]

  backup:
    build: { context: .., dockerfile: deploy/backup.Dockerfile }
    restart: unless-stopped
    depends_on:
      db: { condition: service_healthy }
    environment:
      PGHOST: db
      PGUSER: rondi_owner
      PGPASSWORD: ${DB_OWNER_PASSWORD}
      PGDATABASE: rondi
      BACKUP_PASSPHRASE: ${BACKUP_PASSPHRASE:?}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-30}
      BACKUP_HOUR: ${BACKUP_HOUR:-2}
      BACKUP_OFFSITE_DIR: ${BACKUP_OFFSITE_DIR:+/offsite}
      TZ: Africa/Cairo
    volumes:
      - ${BACKUP_LOCAL_PATH:-./backups}:/backups
      - ${BACKUP_OFFSITE_DIR:-./backups}:/offsite
    networks: [internal]

volumes:
  pgdata:
  caddy_data:

networks:
  internal:
